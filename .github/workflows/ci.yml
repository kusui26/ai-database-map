name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Claude Code プラグイン（plugins/）の静的検証。--strict は未知フィールドも落とす。
      # 認証不要（ローカル検証のみ）。docs/260828_research_claude_auth.md §10 PR-3。
      - name: Validate Claude Code plugin
        run: npx -y @anthropic-ai/claude-code plugin validate plugins/ai-database-map --strict
